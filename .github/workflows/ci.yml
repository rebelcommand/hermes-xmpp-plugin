name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/pip install --quiet pytest ruff pyyaml
          .venv-ci/bin/pip install --quiet -r requirements.txt

      - name: Lint with ruff
        run: .venv-ci/bin/ruff check .

      - name: Run tests
        run: .venv-ci/bin/pytest

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin modules parse
        run: |
          python3 -m py_compile __init__.py
          python3 -m py_compile adapter.py
          python3 -m py_compile omemo_plugin.py
          python3 -m py_compile post_install.py
          python3 -m py_compile hermes_xmpp_plugin_common.py

      - name: Validate the repository root is a plugin
        run: |
          python3 -c "
          import pathlib, sys
          root = pathlib.Path('.').resolve()
          for name in ('plugin.yaml', '__init__.py', 'adapter.py'):
              assert (root / name).is_file(), f'missing {name} at the repository root'
          text = (root / 'plugin.yaml').read_text()
          assert 'name: xmpp-platform' in text, 'plugin.yaml must declare name: xmpp-platform'
          assert 'kind: platform' in text, 'plugin.yaml must declare kind: platform'
          print('Repository root is a valid plugin root')
          "
